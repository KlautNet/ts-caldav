name: Publish Package

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  actions: read
  security-events: write

jobs:
  codeql:
    uses: ./.github/workflows/codeql.yml

  publish:
    needs: [codeql]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # No registry-url: setup-node would write an .npmrc with a placeholder
      # auth token, which makes npm skip trusted publishing (OIDC).
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install -g npm@latest

      # Temporary diagnostics for trusted publishing: the claims npm matches
      # against the trusted publisher entry (no secrets; the signature is dropped).
      - name: Show OIDC token claims
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
            | jq -r '.value | split(".")[1]' | base64 -d 2>/dev/null | jq .

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: npm debug log
        if: failure()
        run: cat /home/runner/.npm/_logs/*-debug-0.log
